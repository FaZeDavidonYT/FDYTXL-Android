name: Build FDYTXL Android APK (phone only)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build installable FDYTXL debug APK
    runs-on: ubuntu-24.04

    steps:
      - name: Get uploaded FDYTXL source ZIP
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licences and install API 36
        shell: bash
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          test -x "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0" "platform-tools"

          "$SDKMANAGER" --list_installed | grep -F 'platforms;android-36'

      - name: Install Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract FDYTXL Android project
        run: |
          mkdir -p workspace
          unzip -q FDYTXL-Android-source.zip -d workspace
          test -f workspace/FDYTXL-Android/app/build.gradle

      - name: Build FDYTXL APK
        working-directory: workspace/FDYTXL-Android
        run: gradle --no-daemon --console=plain :app:assembleDebug

      - name: Save APK as downloadable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: FDYTXL-Android-debug-APK
          path: workspace/FDYTXL-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
