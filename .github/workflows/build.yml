name: Build FDYTXL Android APK (Firebase)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build FDYTXL Firebase APK
    runs-on: ubuntu-24.04

    steps:
      - name: Get FDYTXL Android source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Install Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract Firebase Android source
        run: |
          mkdir -p workspace
          unzip -q FDYTXL-Android-source.zip -d workspace
          test -f workspace/FDYTXL-Android/app/google-services.json
          test -f workspace/FDYTXL-Android/app/src/main/java/com/fdytxl/android/FDYTXLFirebaseService.java

      - name: Build Firebase-enabled APK
        working-directory: workspace/FDYTXL-Android
        run: gradle --no-daemon --console=plain :app:assembleDebug

      - name: Upload downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: FDYTXL-Android-Firebase-APK
          path: workspace/FDYTXL-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
